kind = "web"
previewPath = "/"
title = "Card Scout"
version = "1.0.0"
id = "artifacts/card-scout"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21115

[services.development]
run = "pnpm --filter @workspace/card-scout run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/card-scout", "run", "build" ]
serve = "static"
publicDir = "artifacts/card-scout/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21115"
BASE_PATH = "/"
